const c=document.getElementById('c'),x=c.getContext('2d');let W,H,score=0,eaten=0,life=3,inv=0,over=false,t=0,sealStuck=false,aWasDown=false;let seal={x:100,y:180},kelp=[],sharks=[],fish=[],trash=[];const keys={};function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);seal.x=Math.min(seal.x,W-35);seal.y=Math.min(seal.y,H-35)}addEventListener('resize',resize);resize();function spawn(){kelp.push({x:35+Math.random()*Math.max(1,W-70),y:65+Math.random()*Math.max(1,H-110)})}function reset(){score=0;eaten=0;life=3;inv=0;over=false;sealStuck=false;seal={x:W/3,y:H/2};kelp=[];sharks=[];fish=[];trash=[];for(let i=0;i<7;i++)spawn();for(let i=0;i<5;i++)fish.push({x:Math.random()*W,y:80+Math.random()*(H-160),stuck:false});for(let i=0;i<6;i++)trash.push({x:50+Math.random()*Math.max(1,W-100),y:80+Math.random()*Math.max(1,H-160)});document.getElementById('score').textContent=score;document.getElementById('eaten').textContent=eaten;document.getElementById('life').textContent=life}reset();addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if((over||sealStuck)&&e.key===' ')reset()});addEventListener('keyup',e=>keys[e.key]=false);let touch=null;c.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};if(over||sealStuck)reset()});c.addEventListener('pointermove',e=>{if(touch)touch={x:e.clientX,y:e.clientY}});c.addEventListener('pointerup',()=>touch=null);

x.save();x.translate(41,0);x.rotate(swim*.02);x.beginPath();x.moveTo(-2,0);x.lineTo(22,-23);x.lineTo(17,0);x.lineTo(23,20);x.closePath();x.fill();x.restore();
x.fillStyle='#172a36';x.beginPath();x.arc(-26,-5,2.6,0,Math.PI*2);x.fill();
x.strokeStyle='#3b5868';x.lineWidth=1.5;for(let g=0;g<3;g++){x.beginPath();x.moveTo(-12+g*5,-4);x.lineTo(-14+g*5,3);x.stroke();}
x.strokeStyle='#526b78';x.beginPath();x.moveTo(-35,6);x.quadraticCurveTo(-25,11,-17,7);x.stroke();if(s.stuck){x.strokeStyle='#e5f5f5';x.lineWidth=2;x.beginPath();x.moveTo(-35,-19);x.lineTo(38,18);x.moveTo(-35,18);x.lineTo(38,-19);x.stroke();}x.restore();if(s.x< -70)sharks.splice(i,1);if(!over&&!s.stuck&&inv<=0&&Math.hypot(seal.x-s.x,seal.y-s.y)<42){life--;inv=90;document.getElementById('life').textContent=life;if(life<=0)over=true}}if(inv>0)inv--;drawSeal();if(sealStuck){x.strokeStyle='#e5f5f5';x.lineWidth=3;x.beginPath();x.moveTo(seal.x-30,seal.y-22);x.lineTo(seal.x+30,seal.y+22);x.moveTo(seal.x-30,seal.y+22);x.lineTo(seal.x+30,seal.y-22);x.stroke();x.font='bold 18px system-ui';x.textAlign='center';x.fillStyle='white';x.fillText('Hylje jäi kiinni meriroskaan!',W/2,Math.max(75,H-75));}if(over){x.fillStyle='#00283cbb';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='white';x.font='bold 32px system-ui';x.fillText('Peli päättyi!',W/2,H/2-25);x.font='20px system-ui';x.fillText('Keräsit '+score+' merilevää',W/2,H/2+12);x.fillText('Paina A tai kosketa aloittaaksesi',W/2,H/2+50)}requestAnimationFrame(draw)}draw();

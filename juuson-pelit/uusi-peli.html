<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timanttiseikkailu</title><style>
*{box-sizing:border-box}body{margin:0;background:#b8e5ff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;top:10px;left:12px;background:#ffffffdf;border-radius:12px;padding:9px 14px;font-weight:bold;opacity:0;transition:opacity .3s}#version{position:fixed;right:10px;top:10px;background:#ffffffc9;padding:7px;border-radius:8px;font-size:13px}#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#ffffffdf;padding:9px;border-radius:10px;text-align:center;max-width:95vw;font-size:14px}
</style></head><body><canvas id="game"></canvas><div id="hud">💎 <span id="score">0</span>/20</div><div id="version">Versio 1.3.0</div><div id="hint">Liiku tikulla. Kaiva A-napilla. Varo punaista kiveä!</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}addEventListener('resize',resize);resize();
const keys=new Set(),player={x:130,y:Math.max(120,H*.82)},rocks=[],diamonds=[],grass=[],goal=20,gates=[{x:500,need:5},{x:970,need:10},{x:1440,need:15},{x:1910,need:20}];let score=0,won=false,paused=false,finalGem=false,message='',messageUntil=0,hudUntil=0;
let seed=73;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let zone=0;zone<4;zone++){for(let i=0;i<5;i++){let x=235+zone*470+i*48+rand()*16,y=H*.76+rand()*H*.15;rocks.push({x,y,hot:false,opened:false,gem:true,needed:i===4?3:1,hits:0})}for(let i=0;i<3;i++){let x=240+zone*470+rand()*225,y=H*.76+rand()*H*.15;rocks.push({x,y,hot:i===0,opened:false,gem:false,needed:1,hits:0})}}for(let i=0;i<5;i++){grass.push({x:210+i*460,y:H*.79+rand()*H*.12,hits:0,needed:i%2?3:1,opened:false,gem:i<4})}
rocks.push({x:2160,y:H*.83,hot:false,opened:false,gem:false,final:true,needed:3,hits:0});
function say(v,ms=1600){message=v;messageUntil=Date.now()+ms}
function action(){if(won){restart();return}if(paused)return;
for(const g of gates){if(Math.abs(player.x-g.x)<78&&!g.open){if(score>=g.need){g.open=true;say('Portti aukesi!')}else say('Tarvitset '+(g.need-score)+' timanttia.');return}}
let target=null,dist=78;
for(const item of [...rocks,...grass]){let d=Math.hypot(player.x-item.x,player.y-item.y);if(!item.opened&&d<dist){target=item;dist=d}}
if(!target){say('Etsi kivi tai kimallus.');return}
if(target.hot){say('Varo kuumaa kiveä!');return}
target.hits++;if(target.hits<target.needed){say('Kaiva vielä!');return}
target.opened=true;
if(target.final){finalGem=true;say('Suuri timantti! Mene kotiin.',3000);return}
if(target.gem){diamonds.push({x:target.x,y:target.y});say('Timantti löytyi!')}else say('Ei timanttia.');
}
addEventListener('keydown',e=>{keys.add(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '||e.key==='Enter')action()});addEventListener('keyup',e=>keys.delete(e.key));
let last=performance.now(),prevA=false,prevStart=false,prevRestart=false;function restart(){score=0;won=false;paused=false;player.x=130;player.y=Math.max(120,H*.82);diamonds.length=0;finalGem=false;gates.forEach(g=>g.open=false);[...rocks,...grass].forEach(r=>{r.opened=false;r.hits=0});document.getElementById('score').textContent='0';document.getElementById('hud').style.opacity='0'}
function draw(t){let dt=Math.min((t-last)/16.67,2);last=t;const pad=navigator.getGamepads?.()[0];let dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);if(pad){dx+=Math.abs(pad.axes[0])>.2?pad.axes[0]:0;dy+=Math.abs(pad.axes[1])>.2?pad.axes[1]:0;let a=!!pad.buttons[0]?.pressed;if(a&&!prevA){if(won)restart();else if(!paused)action()}prevA=a;let start=!!pad.buttons[9]?.pressed;if(start&&!prevStart)paused=!paused;prevStart=start;let back=!!pad.buttons[8]?.pressed;if(back&&!prevRestart)restart();prevRestart=back}if(paused){dx=0;dy=0}let length=Math.hypot(dx,dy)||1;let nextX=Math.max(40,Math.min(2300,player.x+dx/length*4*dt));for(const g of gates){if(!g.open&&player.x<g.x&&nextX>g.x-22)nextX=g.x-22;if(!g.open&&player.x>g.x&&nextX<g.x+22)nextX=g.x+22}player.x=nextX;player.y=Math.max(H*.71,Math.min(H-42,player.y+dy/length*4*dt));for(let i=diamonds.length-1;i>=0;i--){if(Math.hypot(player.x-diamonds[i].x,player.y-diamonds[i].y)<38){diamonds.splice(i,1);score++;document.getElementById('score').textContent=score;document.getElementById('hud').style.opacity='1';hudUntil=Date.now()+2200}}if(finalGem&&player.x<170&&player.y<H*.87)won=true;if(Date.now()>hudUntil)document.getElementById('hud').style.opacity='0';
let cam=Math.max(0,Math.min(2300-W+80,player.x-W*.36));const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#33405c');sky.addColorStop(1,'#e8a67c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam,0);ctx.fillStyle='#3b343d';ctx.beginPath();ctx.moveTo(660,H*.75);ctx.lineTo(1000,H*.19);ctx.lineTo(1080,H*.19);ctx.lineTo(1450,H*.75);ctx.closePath();ctx.fill();ctx.fillStyle='#c64d2b';ctx.beginPath();ctx.moveTo(1000,H*.19);ctx.lineTo(1080,H*.19);ctx.lineTo(1110,H*.31);ctx.lineTo(1040,H*.28);ctx.lineTo(970,H*.34);ctx.closePath();ctx.fill();ctx.strokeStyle='#ff9a32';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(1060,H*.27);ctx.bezierCurveTo(1030,H*.43,1140,H*.55,1190,H*.75);ctx.stroke();ctx.restore();const ground=ctx.createLinearGradient(0,H*.68,0,H);ground.addColorStop(0,'#88a75b');ground.addColorStop(.45,'#587c42');ground.addColorStop(1,'#384e34');ctx.fillStyle=ground;ctx.fillRect(0,H*.68,W,H*.32);ctx.save();ctx.translate(-cam,0);
for(let i=0;i<210;i++){const gx=(i*137)%2350,gy=H*.7+(i*53)%(Math.max(25,H*.29));ctx.strokeStyle=i%3?'#9bbd65':'#355b35';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx-3,gy-6-i%5);ctx.moveTo(gx,gy);ctx.lineTo(gx+3,gy-5-i%4);ctx.stroke()}
const homeY=H*.68;const wall=ctx.createLinearGradient(35,homeY-110,175,homeY);wall.addColorStop(0,'#f4d9ad');wall.addColorStop(1,'#a77955');ctx.fillStyle=wall;ctx.fillRect(35,homeY-110,140,110);ctx.strokeStyle='#7b6349';ctx.lineWidth=3;ctx.strokeRect(35,homeY-110,140,110);ctx.fillStyle='#ad6045';ctx.beginPath();ctx.moveTo(20,homeY-110);ctx.lineTo(105,homeY-170);ctx.lineTo(190,homeY-110);ctx.fill();ctx.fillStyle='#67472d';ctx.fillRect(95,homeY-65,30,65);ctx.fillStyle='#e1e9b6';ctx.fillRect(50,homeY-83,27,28);ctx.strokeStyle='#6b5746';ctx.strokeRect(50,homeY-83,27,28);ctx.beginPath();ctx.moveTo(63,homeY-83);ctx.lineTo(63,homeY-55);ctx.stroke();ctx.fillStyle='#e4c78c';ctx.beginPath();ctx.arc(119,homeY-30,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.font='18px sans-serif';ctx.fillText('KOTI',75,homeY-85);
for(const g of gates){ctx.fillStyle=g.open?'#527a43':'#76573b';ctx.fillRect(g.x-13,H*.67,26,H*.33);ctx.fillStyle='#dbc18a';ctx.font='bold 19px sans-serif';ctx.fillText(g.open?'AUKI':String(g.need)+' 💎',g.x-25,H*.65)}
for(const patch of grass){if(patch.opened)continue;ctx.fillStyle='#b2d577';ctx.beginPath();ctx.ellipse(patch.x,patch.y,24,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e8ffff';ctx.font='bold 18px sans-serif';ctx.fillText('✦',patch.x-5,patch.y-8)}
for(const r of [...rocks].sort((a,b)=>a.y-b.y)){if(r.opened)continue;ctx.fillStyle='rgba(30,35,25,.3)';ctx.beginPath();ctx.ellipse(r.x,r.y+17,34,9,0,0,Math.PI*2);ctx.fill();const stone=ctx.createRadialGradient(r.x-11,r.y-12,2,r.x,r.y,34);stone.addColorStop(0,r.hot?'#ac5d3a':'#76787b');stone.addColorStop(1,r.hot?'#422a2b':'#252a30');ctx.fillStyle=stone;ctx.beginPath();ctx.moveTo(r.x-29,r.y+7);ctx.lineTo(r.x-22,r.y-13);ctx.lineTo(r.x-8,r.y-23);ctx.lineTo(r.x+15,r.y-19);ctx.lineTo(r.x+29,r.y+4);ctx.lineTo(r.x+17,r.y+20);ctx.lineTo(r.x-16,r.y+20);ctx.closePath();ctx.fill();ctx.strokeStyle='#20262a';ctx.lineWidth=1.5;ctx.stroke();if(!r.hot){ctx.fillStyle='#6b9853';ctx.beginPath();ctx.ellipse(r.x-8,r.y-17,13,4,-.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9db46b';ctx.beginPath();ctx.ellipse(r.x+10,r.y-15,8,3,.3,0,Math.PI*2);ctx.fill()}if(r.hot){ctx.strokeStyle='#ffb32c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(r.x-14,r.y-4);ctx.lineTo(r.x+3,r.y+5);ctx.lineTo(r.x+17,r.y-8);ctx.stroke()}}
for(const d of diamonds){ctx.shadowColor='#80eaff';ctx.shadowBlur=12;ctx.fillStyle='#46e5ff';ctx.beginPath();ctx.moveTo(d.x,d.y-16);ctx.lineTo(d.x+15,d.y);ctx.lineTo(d.x,d.y+16);ctx.lineTo(d.x-15,d.y);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();ctx.shadowBlur=0}
ctx.fillStyle='rgba(25,45,25,.32)';ctx.beginPath();ctx.ellipse(player.x,player.y+31,19,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#303746';ctx.fillRect(player.x-12,player.y+23,9,15);ctx.fillRect(player.x+4,player.y+23,9,15);ctx.fillStyle='#2a6cdd';ctx.fillRect(player.x-12,player.y-3,24,27);ctx.fillStyle='#d6a36d';ctx.fillRect(player.x-17,player.y,5,17);ctx.fillRect(player.x+12,player.y,5,17);ctx.fillStyle='#f4bb8e';ctx.beginPath();ctx.arc(player.x,player.y-18,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5b3520';ctx.beginPath();ctx.arc(player.x,player.y-25,15,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#292929';ctx.fillRect(player.x-7,player.y-19,3,3);ctx.fillRect(player.x+5,player.y-19,3,3);ctx.restore();
if(messageUntil>Date.now()){ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(message,W/2,95);ctx.textAlign='left'}if(finalGem&&!won){ctx.fillStyle='#fff';ctx.font='bold 19px sans-serif';ctx.fillText('Kaikki löytyivät! Mene kotiin.',18,H-125)}if(won){ctx.fillStyle='#ffffffec';ctx.fillRect(0,0,W,H);ctx.fillStyle='#222';ctx.textAlign='center';ctx.font='bold 30px sans-serif';ctx.fillText('Voitit! Paina A.',W/2,H/2);ctx.textAlign='left'}if(paused){ctx.fillStyle='#ffffffdd';ctx.fillRect(0,0,W,H);ctx.fillStyle='#222';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('Tauko. Paina Start.',W/2,H/2);ctx.textAlign='left'}requestAnimationFrame(draw)}requestAnimationFrame(draw);
const currentVersion=document.getElementById('version').textContent;async function checkUpdate(){try{let r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;let doc=new DOMParser().parseFromString(await r.text(),'text/html');let v=doc.getElementById('version')?.textContent;if(v&&v!==currentVersion)location.replace(location.pathname+'?v='+Date.now())}catch(e){}}setInterval(checkUpdate,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
</script></body></html>

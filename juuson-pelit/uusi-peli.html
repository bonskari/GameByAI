<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timanttiseikkailu</title><style>
*{box-sizing:border-box}body{margin:0;background:#b8e5ff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;top:10px;left:12px;background:#ffffffdf;border-radius:12px;padding:9px 14px;font-weight:bold}#version{position:fixed;right:10px;top:10px;background:#ffffffc9;padding:7px;border-radius:8px;font-size:13px}#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#ffffffdf;padding:9px;border-radius:10px;text-align:center;max-width:95vw;font-size:14px}
</style></head><body><canvas id="game"></canvas><div id="hud">💎 <span id="score">0</span>/20</div><div id="version">Versio 1.1.4</div><div id="hint">Liiku tikulla. Kaiva A-napilla. Varo punaista kiveä!</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}addEventListener('resize',resize);resize();
const keys=new Set(),player={x:130,y:260},rocks=[],diamonds=[],goal=20;let score=0,won=false,paused=false,message='',messageUntil=0;
let seed=73;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<38;i++){let x=250+rand()*1900,y=110+rand()*450;rocks.push({x,y,hot:i>=goal&&rand()<.24,opened:false,gem:i<goal})}
function action(){if(won)return;let nearest=null,dist=85;for(const r of rocks){let d=Math.hypot(player.x-r.x,player.y-r.y);if(!r.opened&&d<dist){nearest=r;dist=d}}if(!nearest){message='Mene kiven luo!';messageUntil=Date.now()+1500;return}if(nearest.hot){message='Varo kuumaa kiveä!';messageUntil=Date.now()+1800;return}nearest.opened=true;if(nearest.gem){diamonds.push({x:nearest.x,y:nearest.y});message='Timantti löytyi!';messageUntil=Date.now()+1000}else{message='Ei timanttia.';messageUntil=Date.now()+1300}}
addEventListener('keydown',e=>{keys.add(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '||e.key==='Enter')action()});addEventListener('keyup',e=>keys.delete(e.key));
let last=performance.now(),prevA=false,prevStart=false,prevRestart=false;function restart(){score=0;won=false;paused=false;player.x=130;player.y=260;diamonds.length=0;rocks.forEach(r=>r.opened=false);document.getElementById('score').textContent='0'}
function draw(t){let dt=Math.min((t-last)/16.67,2);last=t;const pad=navigator.getGamepads?.()[0];let dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);if(pad){dx+=Math.abs(pad.axes[0])>.2?pad.axes[0]:0;dy+=Math.abs(pad.axes[1])>.2?pad.axes[1]:0;let a=!!pad.buttons[0]?.pressed;if(a&&!prevA){if(won)restart();else if(!paused)action()}prevA=a;let start=!!pad.buttons[9]?.pressed;if(start&&!prevStart)paused=!paused;prevStart=start;let back=!!pad.buttons[8]?.pressed;if(back&&!prevRestart)restart();prevRestart=back}if(paused){dx=0;dy=0}let length=Math.hypot(dx,dy)||1;player.x=Math.max(40,Math.min(2300,player.x+dx/length*4*dt));player.y=Math.max(90,Math.min(620,player.y+dy/length*4*dt));for(let i=diamonds.length-1;i>=0;i--){if(Math.hypot(player.x-diamonds[i].x,player.y-diamonds[i].y)<38){diamonds.splice(i,1);score++;document.getElementById('score').textContent=score}}if(score===goal&&player.x<170&&player.y<180)won=true;
let cam=Math.max(0,Math.min(2300-W+80,player.x-W*.36));const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#33405c');sky.addColorStop(1,'#e8a67c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#74c77a';ctx.fillRect(0,H*.2,W,H);ctx.save();ctx.translate(-cam*.28,0);ctx.fillStyle='#3b343d';ctx.beginPath();ctx.moveTo(660,H*.75);ctx.lineTo(1000,H*.19);ctx.lineTo(1080,H*.19);ctx.lineTo(1450,H*.75);ctx.closePath();ctx.fill();ctx.fillStyle='#c64d2b';ctx.beginPath();ctx.moveTo(1000,H*.19);ctx.lineTo(1080,H*.19);ctx.lineTo(1110,H*.31);ctx.lineTo(1040,H*.28);ctx.lineTo(970,H*.34);ctx.closePath();ctx.fill();ctx.strokeStyle='#ff9a32';ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(1060,H*.27);ctx.bezierCurveTo(1030,H*.43,1140,H*.55,1190,H*.75);ctx.stroke();ctx.restore();ctx.save();ctx.translate(-cam,0);
ctx.fillStyle='#f4cf96';ctx.fillRect(35,70,140,110);ctx.fillStyle='#ad6045';ctx.beginPath();ctx.moveTo(20,75);ctx.lineTo(105,15);ctx.lineTo(190,75);ctx.fill();ctx.fillStyle='#67472d';ctx.fillRect(95,115,30,65);ctx.fillStyle='#222';ctx.font='18px sans-serif';ctx.fillText('KOTI',75,95);
for(const r of rocks){if(r.opened)continue;ctx.fillStyle=r.hot?'#b5291e':'#30343b';ctx.beginPath();ctx.ellipse(r.x,r.y,29,22,0,0,Math.PI*2);ctx.fill();if(r.hot){ctx.strokeStyle='#ffb32c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(r.x-14,r.y-4);ctx.lineTo(r.x+3,r.y+5);ctx.lineTo(r.x+17,r.y-8);ctx.stroke()}}
for(const d of diamonds){ctx.fillStyle='#46e5ff';ctx.beginPath();ctx.moveTo(d.x,d.y-16);ctx.lineTo(d.x+15,d.y);ctx.lineTo(d.x,d.y+16);ctx.lineTo(d.x-15,d.y);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.stroke()}
ctx.fillStyle='#2a6cdd';ctx.fillRect(player.x-12,player.y-3,24,31);ctx.fillStyle='#f4bb8e';ctx.beginPath();ctx.arc(player.x,player.y-18,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5b3520';ctx.fillRect(player.x-15,player.y-34,30,8);ctx.restore();
if(messageUntil>Date.now()){ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(message,W/2,95);ctx.textAlign='left'}if(score===goal&&!won){ctx.fillStyle='#fff';ctx.font='bold 19px sans-serif';ctx.fillText('Kaikki löytyivät! Mene kotiin.',18,H-125)}if(won){ctx.fillStyle='#ffffffec';ctx.fillRect(0,0,W,H);ctx.fillStyle='#222';ctx.textAlign='center';ctx.font='bold 30px sans-serif';ctx.fillText('Voitit! Paina A.',W/2,H/2);ctx.textAlign='left'}if(paused){ctx.fillStyle='#ffffffdd';ctx.fillRect(0,0,W,H);ctx.fillStyle='#222';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('Tauko. Paina Start.',W/2,H/2);ctx.textAlign='left'}requestAnimationFrame(draw)}requestAnimationFrame(draw);
const currentVersion=document.getElementById('version').textContent;async function checkUpdate(){try{let r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;let doc=new DOMParser().parseFromString(await r.text(),'text/html');let v=doc.getElementById('version')?.textContent;if(v&&v!==currentVersion)location.replace(location.pathname+'?v='+Date.now())}catch(e){}}setInterval(checkUpdate,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
</script></body></html>

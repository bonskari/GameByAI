<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uusi peli</title><style>html,body{margin:0;width:100%;height:100%;background:#fff}#version{position:fixed;top:12px;right:12px;font:14px sans-serif;color:#666}</style></head><body><div id="version">Versio 1.0.1</div><script>let pageVersion=document.getElementById('version').textContent;async function checkUpdate(){try{const response=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});if(!response.ok)return;const html=await response.text();const doc=new DOMParser().parseFromString(html,'text/html');const latest=doc.getElementById('version')?.textContent;if(latest&&latest!==pageVersion){location.replace(location.pathname+'?v='+Date.now());}}catch(e){}}setInterval(checkUpdate,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});</script></body></html>
